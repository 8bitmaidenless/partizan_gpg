name: Build macOS


on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-gpg:
    name: Build GnuPG (universal)
    runs-on: macos-14

    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key
        id: cache-key

        run: |
          KEY="macos-gpg-universal-$(shasum -a 256 scripts/build_macos_gpg.sh | awk `{print $1}`)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore GPG build cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with: 
          path: src/partizan_gpg/cipherlib/bundled/macos
          key: ${{ steps.cache-key.outputs.key }}

      - name: Build GnuPG from source
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_macos_gpg.sh
          ./scripts/build_macos_gpg.sh

      - name: Smoke-test bundled GPG
        run: |
          ./src/partizan_gpg/cipherlib/bundled/macos/bin/gpg --version
          lipo -info ./src/partizan_gpg/cipherlib/bundled/macos/bin/gpg

      - name: Save GPG build cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: 
          path: src/partizan_gpg/cipherlib/bundled/macos
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload GPG bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-gpg-bundle
          path: src/partizan_gpg/cipherlib/bundled/macos
          retention-days: 1

build-app:
  name: Build .app + .dmg
  runs-on: macos-14
  needs: build-gpg

  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download GPG bundle
      uses: actions/download-artifact@v4
      with:
        name: macos-gpg-bundle
        path: src/partizan_gpg/cipherlib/bundled/macos

    - name: Fix permissions on bundled libraries
      run: chmod +x src/partizan_gpg/cipherlib/bundled/macos/bin/*

    - name: Install Python dependencies
      run: |
        pip install poetry
        poetry install 
        pip install pyinstaller
      
    - name: Build with PyInstaller
      run: pyinstaller partizan_gpg.spec --clean --noconfirm

    - name: Smoke-test the .app
      run: |
        "./dist/Partizan GPG.app/Contents/MacOS/partizan-gpg" --help || true

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Build DMG
      run: |
        create-dmg \
          --volname "Partizan GPG" \
          --window-size 660 400 \
          --icon-size 120 \
          --icon "Partizan GPG.app" 180 200 \
          --app-drop-link 480 200 \
          --hide-extension "Partizan GPG.app" \
          --no-internet-enable \
          "dist/Partizan-GPG-${{ github.ref_name }}.dmg" \
          "dist/Partizan GPG.app" \
        || true

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Partizan-GPG-macOS
        path: dist/Partizan-GPG-*.dmg

    - name: Attach DMG to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Partizan-GPG-*.dmg