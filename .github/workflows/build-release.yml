name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: partizan-gpg-linux
            binary_path: dist/partizan-gpg
          
          - os: macos-latest
            artifact_name: partizan-gpg-macos
            binary_path: dist/partizan-gpg
          
          - os: windows-latest
            artifact_name: partizan-gpg-windows
            binary_path: dist/partizan-gpg.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install project dependencies
        run: poetry install --with dev

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller
      
      - name: Build binary with PyInstaller
        run: poetry run pyinstaller partizan_gpg.spec

      - name: Rename binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: mv dist/partizan-gpg dist/${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item dist\partizan-gpg.exe ${{ matrix.artifact_name }}.exe
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.exe
          if-no-files-found: error
          retention-days: 14

release:
  name: Create GitHub Release
  needs: build
  if: startsWith(github.ref, 'refs/tags/v')
  runs-on: ubuntu-latest
  permissions:
    contents: write

  steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Display downloaded files
      run: find release-assets -type f

    - name: Create GitHub Release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/**/*
        generate_release_notes: true
