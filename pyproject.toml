[tool.poetry]
name = "partizan_gpg"
version = "0.2.4"
description = "Part of the Partizan Framework. Enables Terminal UI for GPG / PGP key & encryption operations."
authors = ["Dylan Garrett"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
textual = "^8.2.5"
python-gnupg = "^0.5.6"
pyperclip = "^1.11.0"


[tool.poetry.group.dev.dependencies]
textual-dev = "^1.8.0"
ipython = "^9.13.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
partizan-gpg = "partizan_gpg.tui.app:main"